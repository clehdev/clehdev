    <text class="t" x="78" y="313" font-size="15" fill="#cbb9a3">Apps de entrega em Flutter</text>
    <text class="m" x="78" y="330" font-size="12.5" fill="#8fbfec">app do cliente · app do entregador</text>
  </g>

  <rect x="640" y="56" width="1" height="268" fill="#ffffff" fill-opacity=".08"/>
  <text class="m entra" x="690" y="62" font-size="15" fill="#a99a8c" style="animation-delay:.2s">~/clehdev <tspan fill="#9be0c4">$</tspan> cat linguagens.txt</text>
  <g class="entra" style="animation-delay:0.30s">
    <text class="t" x="690" y="108" font-size="16" font-weight="700" fill="#f3e6d3">Flutter / Dart</text>
    <text class="t" x="1140" y="108" text-anchor="end" font-size="13" fill="#a99a8c">principal</text>
    <rect x="690" y="118" width="450" height="3" rx="1.5" fill="#ffffff" fill-opacity=".08"/>
    <rect class="barra" x="690" y="118" width="450" height="3" rx="1.5" fill="#e8b47a" style="animation-delay:0.50s"/>
  </g>
