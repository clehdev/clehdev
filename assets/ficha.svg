    <text class="t" x="78" y="229" font-size="15" fill="#cbb9a3">Comunidade para jovens aprenderem a programar</text>
    <text class="m" x="78" y="246" font-size="12.5" fill="#9be0c4">onboarding · estudos · mural via PR</text>
  </g>
  <g class="entra" style="animation-delay:0.51s">
    <rect x="56" y="272" width="4" height="56" rx="2" fill="#8fbfec"/>
