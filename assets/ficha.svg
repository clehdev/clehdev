  </g>

  <g class="entra" style="animation-delay:.9s">
    <circle class="vivo" cx="696" cy="345" r="4" fill="#57d38c"/>
    <text class="m" x="710" y="349" font-size="13" fill="#a99a8c">agora: construindo apps e formando novos devs<tspan class="cursor" fill="#e8b47a">_</tspan></text>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>