    <text class="t" x="78" y="145" font-size="15" fill="#cbb9a3">Apps de cuidados pessoais femininos</text>
    <text class="m" x="78" y="162" font-size="12.5" fill="#e8b47a">Raízes · 400 mil+ downloads</text>
  </g>
  <g class="entra" style="animation-delay:0.33s">
    <rect x="56" y="188" width="4" height="56" rx="2" fill="#9be0c4"/>
