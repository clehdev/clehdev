<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Projetos e linguagens de Cledilson Silva" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  .cursor { animation: piscar 1s steps(1) infinite; }
  @keyframes piscar { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .entra { opacity: 0; animation: entrar .9s ease-out forwards; }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .barra { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: crescer 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes crescer { to { transform: scaleX(1); } }
  .luz { animation: luz 8s ease-in-out infinite alternate; }
  @keyframes luz { from { opacity: .5; transform: translateX(0); } to { opacity: 1; transform: translateX(80px); } }
  .vivo { animation: vivo 2s ease-in-out infinite; }
  @keyframes vivo { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .entra { opacity: 1; } .barra { transform: none; } }
</style>
<defs>
  <clipPath id="cartao"><rect width="1200" height="380" rx="24"/></clipPath>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#120f12"/><stop offset=".6" stop-color="#1a1819"/><stop offset="1" stop-color="#2b2b2c"/>
  </linearGradient>
  <radialGradient id="quente" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#e8b47a" stop-opacity=".14"/><stop offset="1" stop-color="#e8b47a" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#cartao)">
  <rect width="1200" height="380" fill="url(#fundo)"/>
  <circle class="luz" cx="260" cy="190" r="340" fill="url(#quente)"/>

  <text class="m entra" x="56" y="62" font-size="15" fill="#a99a8c">~/clehdev <tspan fill="#9be0c4">$</tspan> ls projetos/</text>

  <g class="entra" style="animation-delay:0.15s">
    <rect x="56" y="104" width="4" height="56" rx="2" fill="#e8b47a"/>
