    <rect class="barra" x="690" y="164" width="333" height="3" rx="1.5" fill="#b18cff" style="animation-delay:0.65s"/>
  </g>
  <g class="entra" style="animation-delay:0.54s">
    <text class="t" x="690" y="200" font-size="16" font-weight="700" fill="#f3e6d3">Swift</text>
    <text class="t" x="1140" y="200" text-anchor="end" font-size="13" fill="#a99a8c">iOS nativo</text>
    <rect x="690" y="210" width="450" height="3" rx="1.5" fill="#ffffff" fill-opacity=".08"/>
    <rect class="barra" x="690" y="210" width="306" height="3" rx="1.5" fill="#ff8f6b" style="animation-delay:0.80s"/>
  </g>
  <g class="entra" style="animation-delay:0.66s">
    <text class="t" x="690" y="246" font-size="16" font-weight="700" fill="#f3e6d3">Java</text>
    <text class="t" x="1140" y="246" text-anchor="end" font-size="13" fill="#a99a8c">back-end e Android</text>
    <rect x="690" y="256" width="450" height="3" rx="1.5" fill="#ffffff" fill-opacity=".08"/>
    <rect class="barra" x="690" y="256" width="315" height="3" rx="1.5" fill="#ffad66" style="animation-delay:0.95s"/>
  </g>
  <g class="entra" style="animation-delay:0.78s">
    <text class="t" x="690" y="292" font-size="16" font-weight="700" fill="#f3e6d3">Python</text>
    <text class="t" x="1140" y="292" text-anchor="end" font-size="13" fill="#a99a8c">automação e scripts</text>
    <rect x="690" y="302" width="450" height="3" rx="1.5" fill="#ffffff" fill-opacity=".08"/>
