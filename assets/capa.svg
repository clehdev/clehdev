<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Cledilson Silva, especialista mobile com Flutter">
<style>
  .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
  /* estrelas */
  .estrela { animation: brilho 3s ease-in-out infinite alternate; }
  @keyframes brilho { from { opacity: .15; } to { opacity: .9; } }
  /* chuva: o padrão se repete a cada 40px, então descer 40px e recomeçar parece infinito */
  .chuva { animation: chuva .8s linear infinite; }
  @keyframes chuva { from { transform: translateY(-40px); } to { transform: translateY(0); } }
  /* cursor e prompt */
  .cursor { animation: piscar 1s steps(1) infinite; }
  @keyframes piscar { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  /* cargos alternando: 4 frases, cada uma com 3s no ar */
  .cargo { opacity: 0; animation: cargo 12s ease-in-out infinite; }
  .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; } .c4 { animation-delay: 9s; }
  @keyframes cargo {
    0% { opacity: 0; transform: translateY(12px); }
    4%, 21% { opacity: 1; transform: translateY(0); }
    25%, 100% { opacity: 0; transform: translateY(-12px); }
  }
  /* chips flutuando de leve */
  .chip { animation: boiar 4s ease-in-out infinite; }
  @keyframes boiar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  /* código subindo no fundo */
  .token { opacity: 0; animation: subir linear infinite; }
  @keyframes subir {
    0% { opacity: 0; transform: translateY(0); }
    15% { opacity: .35; } 80% { opacity: .2; }
    100% { opacity: 0; transform: translateY(-330px); }
  }
  /* vapor do café */
  .vapor { transform-box: fill-box; animation: vapor 2.4s ease-in-out infinite; }
  .v2 { animation-delay: .6s; } .v3 { animation-delay: 1.2s; }
  @keyframes vapor { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: .95; } 100% { opacity: 0; transform: translateY(-18px); } }
  /* app no celular: hot reload a cada 8s e os cards entram em sequência */
  .reload { transform-box: fill-box; transform-origin: center; animation: reload 8s ease-in-out infinite; }
  @keyframes reload {
    0% { opacity: 0; transform: scale(.6); }
    4%, 14% { opacity: 1; transform: scale(1); }
    20%, 100% { opacity: 0; transform: scale(.9); }
  }
  .card { opacity: 0; animation: card 8s ease-out infinite both; }
  .k2 { animation-delay: .25s; } .k3 { animation-delay: .5s; }
  @keyframes card {
    0%, 14% { opacity: 0; transform: translateX(26px); }
    24%, 90% { opacity: 1; transform: translateX(0); }
    97%, 100% { opacity: 0; transform: translateX(0); }
  }
  .fab { transform-box: fill-box; transform-origin: center; animation: fab 2s ease-in-out infinite; }
  @keyframes fab { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .tela { animation: tela 4s ease-in-out infinite alternate; }
  @keyframes tela { from { opacity: .55; } to { opacity: 1; } }
  /* controle: botões acendendo em sequência e uma "jogada" de vez em quando */
  .botao { animation: botao 2.4s ease-in-out infinite; }
  .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; } .b4 { animation-delay: 1.8s; }
  @keyframes botao { 0%, 70%, 100% { opacity: .45; } 10%, 30% { opacity: 1; } }
  .controle { transform-box: fill-box; transform-origin: 50% 100%; animation: jogada 6s ease-in-out infinite; }
  @keyframes jogada { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-4deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } }
  /* plaquinhas militares balançando como um pêndulo, presas no topo */
  .plaquinhas { transform-box: view-box; transform-origin: 652px 0px; animation: pendulo 5s ease-in-out infinite alternate; }
  @keyframes pendulo { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .luz { animation: tela 5s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1; } .token, .c2, .c3, .c4, .reload { opacity: 0 !important; } }
</style>
<defs>
  <clipPath id="cartao"><rect width="1200" height="420" rx="28"/></clipPath>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#15111f"/><stop offset=".55" stop-color="#231b36"/><stop offset="1" stop-color="#3a2620"/>
  </linearGradient>
  <radialGradient id="abajur" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffbe6e" stop-opacity=".28"/><stop offset="1" stop-color="#ffbe6e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="brilhoTela" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8fbfec" stop-opacity=".35"/><stop offset="1" stop-color="#8fbfec" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2342"/><stop offset="1" stop-color="#2c2f5e"/></linearGradient>
  <clipPath id="vidro"><rect x="905" y="40" width="230" height="190" rx="6"/></clipPath>
  <pattern id="gotas" width="18" height="40" patternUnits="userSpaceOnUse">
    <line x1="6" y1="0" x2="3" y2="13" stroke="#bccdff" stroke-opacity=".5" stroke-width="1.4"/>
    <line x1="15" y1="20" x2="12" y2="31" stroke="#bccdff" stroke-opacity=".35" stroke-width="1.2"/>
  </pattern>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dde3"/><stop offset=".5" stop-color="#9aa1ab"/><stop offset="1" stop-color="#c8cdd4"/></linearGradient>
</defs>
