# Gera a cobrinha que percorre o gráfico de contribuições (projeto Platane/snk).
# Roda todo dia e publica os SVGs na branch "output", que o README usa.
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 6h (horário de Brasília)
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar os SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-escuro.svg?palette=github-dark&color_snake=#e8b47a&color_dots=#161b22,#3a2a1e,#6d4a31,#a9622a,#e8b47a
            dist/snake-claro.svg?color_snake=#7a4a2e&color_dots=#ebedf0,#f6e4cc,#e8b47a,#c8803e,#7a4a2e

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
